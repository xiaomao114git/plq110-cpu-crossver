<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>发卡器 · PLQ2</title>
<style>
:root{
  --bg:#080a0d; --panel:#141920; --panel2:#1a2028; --line:#252e39;
  --fg:#e6edf3; --muted:#8b98a5; --accent:#4cc2a0; --warn:#e0b155; --danger:#e06a6a;
}
@media (prefers-color-scheme:light){
  :root{--bg:#eef2f6;--panel:#fff;--panel2:#f5f8fb;--line:#dbe3ec;--fg:#11161c;--muted:#5d6a78;--accent:#158f72;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(ellipse 130% 70% at 50% -8%,#1b232e 0%,transparent 60%),var(--bg);
  color:var(--fg); min-height:100vh;
  font:15px/1.55 -apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  padding:calc(16px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;
}
@media (prefers-color-scheme:light){
  body{background:radial-gradient(ellipse 130% 70% at 50% -8%,#dde7f1 0%,transparent 60%),var(--bg);}
}
h1{font-size:21px;margin:0 0 4px;font-weight:700;letter-spacing:.01em}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 18px;line-height:1.55}
.card{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;
  box-shadow:0 12px 32px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.04);
}
@media (prefers-color-scheme:light){
  .card{box-shadow:0 12px 32px rgba(15,23,32,.08),inset 0 1px 0 #fff;}
}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
input,select{
  width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;
  background:#0b0e12;color:var(--fg);font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  transition:border-color .15s,box-shadow .15s;
}
@media (prefers-color-scheme:light){input,select{background:#fff}}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
input::placeholder{color:#54606e}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
button{
  border:1px solid var(--line);border-radius:11px;padding:13px 16px;font-size:15px;
  font-weight:650;font-family:inherit;background:var(--panel2);color:var(--fg);cursor:pointer;
  transition:transform .12s,filter .12s;
}
button:active{transform:translateY(1px)}
button.primary{
  width:100%;border:none;font-weight:700;color:#04120e;
  background:linear-gradient(135deg,#47bb9a,#2e8f73);
  box-shadow:0 6px 22px rgba(76,194,160,.24);
}
button.primary:disabled{opacity:.5;box-shadow:none;filter:grayscale(.3)}
.out{
  margin-top:14px;padding:15px;border-radius:12px;background:#0b0e12;border:1px solid var(--line);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:16px;font-weight:700;letter-spacing:.06em;color:var(--accent);
  word-break:break-all;text-align:center;line-height:1.5;
  user-select:all;-webkit-user-select:all;
}
@media (prefers-color-scheme:light){.out{background:#f4f8fb}}
.out.empty{color:var(--muted);font-weight:500;font-size:12.5px;letter-spacing:0}
.meta{margin-top:11px;font-size:12px;color:var(--muted);line-height:1.65}
.meta b{color:var(--fg);font-weight:600}
.err{color:var(--danger);background:rgba(224,106,106,.09);border:1px solid rgba(224,106,106,.28);
  border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:12px;display:none}
.warnbox{
  border:1px solid rgba(224,177,85,.34);background:rgba(224,177,85,.09);
  border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.65;color:var(--warn);margin-bottom:16px;
}
.warnbox b{color:#f0c869}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;padding:10px 0;font-size:13.5px;font-weight:650;border-radius:10px}
.seg button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.hist{margin-top:14px}
.hist-item{
  display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);
  font-size:12px;
}
.hist-item:last-child{border-bottom:none}
.hist-code{flex:1;font-family:ui-monospace,monospace;word-break:break-all;color:var(--accent);font-weight:600}
.hist-meta{flex:0 0 auto;color:var(--muted);font-size:11px;text-align:right}
.hist-copy{flex:0 0 auto;padding:6px 10px;font-size:11.5px;border-radius:8px}
.toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;
  background:#11161c;color:#fff;border:1px solid var(--line);padding:10px 18px;border-radius:999px;
  font-size:13px;transition:opacity .18s,transform .18s;z-index:99;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<h1>发卡器</h1>
<p class="sub">生成 PLQ2 短卡密（43 字符）。离线运行，不联网，不发任何请求。</p>

<div class="warnbox">
  <b>本文件含签名密钥。</b>泄露给任何人就等于对方可以无限伪造卡密。只在自己设备上保存，<b>不要放进模块分发包</b>，也不要发给买家。
</div>

<div class="card">
  <div class="field">
    <label>机器码 / 序列号（16 位）</label>
    <input id="mid" placeholder="例如 3B15CQ00X4C00000" maxlength="16" autocomplete="off" spellcheck="false" autocapitalize="characters">
  </div>

  <div class="row field">
    <div>
      <label>卡密序号</label>
      <input id="serial" type="number" value="1" min="1" max="4294967295" inputmode="numeric">
    </div>
    <div>
      <label>有效期（天）</label>
      <input id="days" type="number" value="0" min="0" placeholder="0=永久" inputmode="numeric">
    </div>
  </div>

  <button class="primary" id="go">生成卡密</button>

  <div class="out empty" id="out">点击上方按钮生成</div>
  <div class="meta" id="meta"></div>
  <div class="err" id="err"></div>
</div>

<div class="card hist">
  <label style="margin-bottom:4px">本次生成记录</label>
  <div id="hist"><div style="color:var(--muted);font-size:12px;padding:8px 0">还没有生成过</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   PLQ2 卡密生成
   格式：PLQ2-<base64url(issued:u32be | expires:u32be | serial:u32be | tag:16)>
   tag = HMAC-SHA256(key, "PLQ2\0" | machine:16 | "\0" | fields:12)[:16]
   key = K1[i]^KJ[i%8] ++ K2[i]^KJ[(i+3)%8]
   与 licverify 的 lic_parse_short() 必须逐字节一致。
   SHA256 用纯 JS 实现：file:// 下 crypto.subtle 不可用。
============================================================ */

// 密钥常量（与 licverify 源码一致；夹了垃圾字节，两半异或合成 32 字节）
var K1 = [0x5a,0x17,0xc4,0x91,0x3e,0x6d,0x08,0xf2,0xb3,0x4a,0x77,0xd9,0x26,0x8e,0x51,0x0b];
var KJ = [0xaa,0x55,0xaa,0x55,0x13,0x37,0xde,0xad];
var K2 = [0x9c,0xe0,0x35,0x72,0x4f,0x1b,0xa6,0xd8,0x63,0x2c,0x80,0xf5,0x09,0xb7,0x4e,0x21];

function licKey() {
  var out = new Uint8Array(32), i;
  for (i = 0; i < 16; i++) out[i] = (K1[i] ^ KJ[i % 8]) & 0xff;
  for (i = 0; i < 16; i++) out[16 + i] = (K2[i] ^ KJ[(i + 3) % 8]) & 0xff;
  return out;
}

/* ---------- SHA-256 ---------- */
var K256 = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
];

function ror(x, n) { return ((x >>> n) | (x << (32 - n))) >>> 0; }

function sha256(bytes) {
  var h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var len = bytes.length;
  var bitLen = len * 8;
  // 填充：0x80 + 若干 0 到 len%64==56 + 8 字节大端长度
  var padLen = ((len % 64) < 56) ? (56 - (len % 64)) : (120 - (len % 64));
  var total = len + padLen + 8;
  var m = new Uint8Array(total);
  m.set(bytes, 0);
  m[len] = 0x80;
  // 写 64 位长度（高 32 位在 JS 里取 0，足够处理本场景的长文本）
  var hi = Math.floor(bitLen / 0x100000000);
  var lo = bitLen >>> 0;
  m[total - 8] = (hi >>> 24) & 0xff; m[total - 7] = (hi >>> 16) & 0xff;
  m[total - 6] = (hi >>> 8) & 0xff;  m[total - 5] = hi & 0xff;
  m[total - 4] = (lo >>> 24) & 0xff; m[total - 3] = (lo >>> 16) & 0xff;
  m[total - 2] = (lo >>> 8) & 0xff;  m[total - 1] = lo & 0xff;

  var w = new Array(64);
  for (var off = 0; off < total; off += 64) {
    var i;
    for (i = 0; i < 16; i++) {
      var p = off + i * 4;
      w[i] = ((m[p] << 24) | (m[p+1] << 16) | (m[p+2] << 8) | m[p+3]) >>> 0;
    }
    for (i = 16; i < 64; i++) {
      var s0 = (ror(w[i-15],7) ^ ror(w[i-15],18) ^ (w[i-15] >>> 3)) >>> 0;
      var s1 = (ror(w[i-2],17) ^ ror(w[i-2],19) ^ (w[i-2] >>> 10)) >>> 0;
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    var a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
    for (i = 0; i < 64; i++) {
      var S1 = (ror(e,6) ^ ror(e,11) ^ ror(e,25)) >>> 0;
      var ch = ((e & f) ^ (~e & g)) >>> 0;
      var t1 = (hh + S1 + ch + K256[i] + w[i]) >>> 0;
      var S0 = (ror(a,2) ^ ror(a,13) ^ ror(a,22)) >>> 0;
      var mj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
      var t2 = (S0 + mj) >>> 0;
      hh=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    h[0]=(h[0]+a)>>>0; h[1]=(h[1]+b)>>>0; h[2]=(h[2]+c)>>>0; h[3]=(h[3]+d)>>>0;
    h[4]=(h[4]+e)>>>0; h[5]=(h[5]+f)>>>0; h[6]=(h[6]+g)>>>0; h[7]=(h[7]+hh)>>>0;
  }

  var out = new Uint8Array(32);
  for (var j = 0; j < 8; j++) {
    out[j*4]   = (h[j] >>> 24) & 0xff;
    out[j*4+1] = (h[j] >>> 16) & 0xff;
    out[j*4+2] = (h[j] >>> 8) & 0xff;
    out[j*4+3] = h[j] & 0xff;
  }
  return out;
}

/* ---------- HMAC-SHA256 ---------- */
function hmacSha256(key, msg) {
  var k = new Uint8Array(64), i;
  if (key.length > 64) {
    var kh = sha256(key);
    k.set(kh, 0);
  } else {
    k.set(key, 0);
  }
  var ip = new Uint8Array(64 + msg.length);
  var op = new Uint8Array(64 + 32);
  for (i = 0; i < 64; i++) { ip[i] = k[i] ^ 0x36; op[i] = k[i] ^ 0x5c; }
  ip.set(msg, 64);
  var inner = sha256(ip);
  op.set(inner, 64);
  return sha256(op);
}

/* ---------- base64url（无填充） ---------- */
var B64U = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function b64uEnc(bytes) {
  var out = '', i;
  for (i = 0; i < bytes.length; i += 3) {
    var b0 = bytes[i], b1 = bytes[i+1], b2 = bytes[i+2];
    var has1 = (i + 1) < bytes.length, has2 = (i + 2) < bytes.length;
    out += B64U[b0 >> 2];
    out += B64U[((b0 & 3) << 4) | ((has1 ? b1 : 0) >> 4)];
    if (has1) out += B64U[(((has1 ? b1 : 0) & 0xf) << 2) | ((has2 ? b2 : 0) >> 6)];
    if (has2) out += B64U[(has2 ? b2 : 0) & 0x3f];
  }
  return out;
}

function u32be(v) {
  return [(v >>> 24) & 0xff, (v >>> 16) & 0xff, (v >>> 8) & 0xff, v & 0xff];
}

/* ---------- 生成 ---------- */
function makeCode(machine, serial, expires, issued) {
  if (machine.length !== 16) throw new Error('机器码必须是 16 位，当前 ' + machine.length + ' 位');
  var dev = [];
  for (var i = 0; i < 16; i++) dev.push(machine.charCodeAt(i) & 0xff);

  var fields = u32be(issued).concat(u32be(expires), u32be(serial));

  // msg = "PLQ2\0" | machine(16) | "\0" | fields(12)
  var msg = [0x50,0x4c,0x51,0x32,0x00].concat(dev, [0x00], fields);
  var tag = hmacSha256(licKey(), new Uint8Array(msg)).slice(0, 16);

  var raw = new Uint8Array(28);
  raw.set(fields, 0);
  raw.set(tag, 12);

  var code = 'PLQ2-' + b64uEnc(raw);
  if (code.length !== 43) throw new Error('内部错误：长度应为 43，实得 ' + code.length);
  return code;
}

/* ---------- 界面 ---------- */
function $(id) { return document.getElementById(id); }

function toast(t) {
  var el = $('toast');
  el.textContent = t;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.remove('show'); }, 1600);
}

function fmtDate(sec) {
  if (!sec) return '永久';
  var d = new Date(sec * 1000);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

var history = [];

function render() {
  var box = $('hist');
  if (!history.length) {
    box.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:8px 0">还没有生成过</div>';
    return;
  }
  box.innerHTML = '';
  history.forEach(function (h, idx) {
    var d = document.createElement('div');
    d.className = 'hist-item';
    var c = document.createElement('div');
    c.className = 'hist-code';
    c.textContent = h.code;
    var m = document.createElement('div');
    m.className = 'hist-meta';
    m.textContent = '#' + h.serial + ' · ' + (h.expires ? '至 ' + fmtDate(h.expires) : '永久');
    var b = document.createElement('button');
    b.className = 'hist-copy';
    b.textContent = '复制';
    b.onclick = function () { copyText(h.code); };
    d.appendChild(c); d.appendChild(m); d.appendChild(b);
    box.appendChild(d);
  });
}

function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function () { toast('已复制'); },
      function () { legacyCopy(t); });
  } else {
    legacyCopy(t);
  }
}
function legacyCopy(t) {
  var ta = document.createElement('textarea');
  ta.value = t;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制'); }
  catch (e) { toast('复制失败，请长按选择'); }
  document.body.removeChild(ta);
}

$('go').onclick = function () {
  var errEl = $('err'), outEl = $('out'), metaEl = $('meta');
  errEl.style.display = 'none';
  metaEl.textContent = '';
  var mid = ($('mid').value || '').trim().toUpperCase();
  var serial = parseInt($('serial').value, 10);
  var days = parseInt($('days').value, 10);
  if (isNaN(days) || days < 0) days = 0;
  if (isNaN(serial) || serial < 1) serial = 1;

  if (mid.length !== 16) {
    errEl.textContent = '机器码需要 16 位（当前 ' + mid.length + ' 位）。可在 WebUI 锁屏页复制机器码。';
    errEl.style.display = 'block';
    outEl.className = 'out empty';
    outEl.textContent = '输入不完整';
    return;
  }

  try {
    var now = Math.floor(Date.now() / 1000);
    var expires = days > 0 ? now + days * 86400 : 0;
    var code = makeCode(mid, serial, expires, now);

    outEl.className = 'out';
    outEl.textContent = code;
    outEl.onclick = function () { copyText(code); };

    metaEl.innerHTML =
      '机器码 <b>' + mid + '</b><br>' +
      '序号 <b>#' + serial + '</b> · 到期 <b>' + (expires ? fmtDate(expires) : '永久') + '</b><br>' +
      '签发 ' + fmtDate(now) + ' · 长度 <b>' + code.length + '</b> 字符（点击卡密可复制）';

    history.unshift({ code: code, serial: serial, expires: expires });
    if (history.length > 20) history.pop();
    render();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
};

// 从 WebUI 的锁屏页复制过来的机器码往往带空格分组，自动清理
$('mid').addEventListener('input', function () {
  var v = this.value.replace(/[\s\-]/g, '').toUpperCase();
  if (v !== this.value) this.value = v;
});
$('mid').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { $('serial').focus(); }
});

render();
</script>
</body>
</html>
