name: build-all-kernels

# 为 5.10 / 5.15 / 6.1 / 6.6 / 6.12 / 6.18 六个 GKI 内核各产出一份 cpuinfo_redirect.ko
#
# 为什么必须云端编译：
#   1. 主机工具（sorttable/objtool）依赖 glibc，Android 和 Windows 上都编不过
#   2. PROC 后端需要 vmlinux 才能提取 proc_dir_entry 偏移
#
# 产物 vermagic 是裸版本号（LOCALVERSION 为空），部署时用
#   tools/repack-modinfo.py --uname-r '<目标设备 uname -r>'
# 改成目标设备的完整串，不需要二次编译。
on:
  workflow_dispatch:
    inputs:
      no_crc:
        description: '空 __versions 构建（绕开 Module.symvers）'
        type: boolean
        default: true
      keep_debug:
        description: '保留调试符号（体积大，仅排查用）'
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # 单目标验证阶段：先只在 6.1 上把 BTF 问题解决
          # 成功后再扩回六版本矩阵（见 PROBE-MODE 注释）
          - { branch: 'android14-6.1',  kernel: '6.1',  backend: 'proc' }
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc flex bison libssl-dev \
            libelf-dev gcc-aarch64-linux-gnu python3 dwarves

      - name: 缓存内核源码
        uses: actions/cache@v4
        with:
          path: kernel
          key: gki-${{ matrix.branch }}-v2

      - name: 获取 GKI 源码
        run: |
          if [ ! -f kernel/Makefile ]; then
            rm -rf kernel
            git clone --depth 1 -b ${{ matrix.branch }} \
              https://android.googlesource.com/kernel/common kernel
          fi
          echo '== 源码版本 =='
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) +=' kernel/Makefile | head -3
          echo '== 是否有 cpuinfo hook =='
          ls kernel/include/trace/hooks/cpuinfo.h 2>/dev/null && echo '有' || echo '无'

      - name: 配置内核
        run: |
            # 用普通 arm64 defconfig：gki_defconfig 是为 build/build.sh 设计的，
            # 直接 make 会缺 KMI 符号表等前置，1 分钟就挂。
            # 只需要 DEBUG_INFO=y —— 后面用 pahole -J 从 DWARF 直接生成 .BTF 段，
            # 完全不碰 DEBUG_INFO_BTF 那条 Kconfig 依赖链（它依赖 PAHOLE_VERSION 探测）。
            make -C kernel O=$PWD/out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
            ./kernel/scripts/config --file out/.config -d DEBUG_INFO_NONE
            ./kernel/scripts/config --file out/.config -e DEBUG_INFO -e DEBUG_INFO_DWARF4
            ./kernel/scripts/config --file out/.config --set-str LOCALVERSION ''
            make -C kernel O=$PWD/out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
            echo "== DEBUG_INFO 配置 =="
            grep -E "CONFIG_DEBUG_INFO" out/.config | head -8
            grep -q "CONFIG_DEBUG_INFO=y" out/.config || { echo "::error::DEBUG_INFO 未开"; exit 1; }
            echo "== pahole =="
            command -v pahole || { echo "::error::缺 pahole"; exit 1; }
            pahole --version
      - name: 编译内核取 vmlinux
        run: |
          set -o pipefail
          make -C kernel O=$PWD/out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc) vmlinux > build.log 2>&1
          RC=$?
          echo "make 退出码: $RC"
          if [ $RC -ne 0 ]; then
            echo "===== 自动提取的错误上下文 ====="
            grep -n -B3 -A8 -E "error:|Error [0-9]|No such file|not found|undefined" build.log | head -150
            echo "===== 日志尾部 60 行 ====="
            tail -60 build.log
            exit $RC
          fi
          tail -20 build.log
          ls -la out/vmlinux

      - name: 提取 BTF 并生成偏移表
        run: |
            VMLINUX=out/vmlinux
            test -s "$VMLINUX" || { echo "::error::没有 vmlinux"; exit 1; }
            echo "vmlinux: $(stat -c%s $VMLINUX) 字节"
            pahole --version | tee pahole.txt
            
            # 内核官方的 BTF 生成参数（scripts/pahole-flags.sh）：
            #   pahole >= 1.21 → --btf_gen_floats
            #   pahole >= 1.24 → --skip_encoding_btf_enum64
            #   pahole >= 1.25 → --skip_encoding_btf_inconsistent_proto --btf_gen_optimized
            # 少这两个参数会分别导致：
            #   proc_dir_entry not found        （被优化掉，需要 --btf_gen_optimized）
            #   FWD (anon) Error emitting BTF   （原型不一致，需要 --skip_encoding_btf_inconsistent_proto）
            PAHOLE_FLAGS=""
            PV=$(pahole --version | sed "s/^v//" | cut -d. -f1,2 | tr -d ".")
            echo "pahole 版本码: $PV"
            echo ""
            echo "===== 阶段0: 布局前提条件 ====="
            grep -E "CONFIG_DEBUG_SPINLOCK|CONFIG_DEBUG_LOCK_ALLOC|CONFIG_SMP|CONFIG_PREEMPT_RT|CONFIG_RANDSTRUCT" out/.config | tee layout-prereq.txt || echo "(以上均未设置)"
            echo ""
            echo "--- spinlock_t 实际大小（从 DWARF 读，不靠推断）---"
            pahole $PAHOLE_FLAGS -C spinlock_t "$VMLINUX" 2>&1 | head -8 | tee spinlock-size.txt
            echo ""
            echo "--- 其它关键结构 ---"
            for T in raw_spinlock_t list_head proc_dir_entry proc_ops seq_file; do
              pahole $PAHOLE_FLAGS -C $T "$VMLINUX" 2>/dev/null | head -2 | tee -a layout-sizes.txt
              echo "---" >> layout-sizes.txt
            done
            echo ""
            if [ -n "$PV" ] && [ "$PV" -ge 121 ]; then PAHOLE_FLAGS="$PAHOLE_FLAGS --btf_gen_floats"; fi
            if [ -n "$PV" ] && [ "$PV" -ge 124 ]; then PAHOLE_FLAGS="$PAHOLE_FLAGS --skip_encoding_btf_enum64"; fi
            if [ -n "$PV" ] && [ "$PV" -ge 125 ]; then PAHOLE_FLAGS="$PAHOLE_FLAGS --skip_encoding_btf_inconsistent_proto --btf_gen_optimized"; fi
            echo "pahole 参数: $PAHOLE_FLAGS"
            
            # 阶段2：加了 --btf_gen_optimized 后，被优化掉的类型也能查到
            echo "===== 阶段2: DWARF 结构完整性 ====="
            pahole -F dwarf $PAHOLE_FLAGS -C proc_dir_entry "$VMLINUX" > dwarf-pde.txt 2>&1 || true
            pahole -F dwarf $PAHOLE_FLAGS -C proc_ops "$VMLINUX" > dwarf-pops.txt 2>&1 || true
            echo "--- proc_dir_entry ---"; head -25 dwarf-pde.txt
            echo "--- proc_ops ---"; head -15 dwarf-pops.txt
            # pahole 找不到类型时退出码仍为 0，必须查输出内容
            grep -q "not found" dwarf-pde.txt && { echo "::error::阶段2失败 - DWARF 无 proc_dir_entry"; exit 1; }
            grep -q "not found" dwarf-pops.txt && { echo "::error::阶段2失败 - DWARF 无 proc_ops"; exit 1; }
            grep -q "struct proc_dir_entry" dwarf-pde.txt || { echo "::error::阶段2失败 - 输出无结构定义"; exit 1; }
            
            echo "===== 阶段3: 生成 BTF ====="
            set +e
            pahole $PAHOLE_FLAGS --btf_encode_detached=btf.detached.bin "$VMLINUX" 2>&1 | tee btf-detached.log
            set -e
            if [ -s btf.detached.bin ]; then
              echo "stage3a OK: $(stat -c%s btf.detached.bin) 字节"
              cp btf.detached.bin btf.bin
            else
              echo "stage3a 空，转 3b"
              cp "$VMLINUX" vmlinux.btf-src
              set +e
              pahole $PAHOLE_FLAGS -J vmlinux.btf-src 2>&1 | tee btf-convert.log
              set -e
              readelf -SW vmlinux.btf-src 2>/dev/null | grep -E "\.BTF" | tee btf-section.txt || true
              aarch64-linux-gnu-objcopy --dump-section .BTF=btf.dump.bin vmlinux.btf-src vmlinux.dump.elf 2>&1 | tee btf-dump.log || true
              if [ -s btf.dump.bin ]; then
                echo "stage3b OK: $(stat -c%s btf.dump.bin) 字节"
                cp btf.dump.bin btf.bin
              else
                echo "::error::阶段3失败"
                echo "=== pahole 日志 ==="; cat btf-convert.log
                echo "=== 段表 ==="; cat btf-section.txt 2>/dev/null || echo "(无)"
                exit 1
              fi
            fi
            
            echo "===== 阶段3c: BTF 反查 ====="
            pahole -F btf -C proc_dir_entry btf.bin > btf-verify.txt 2>&1 || true
            head -15 btf-verify.txt
            grep -q "not found" btf-verify.txt && { echo "::error::BTF 里查不到 proc_dir_entry"; exit 1; }
            
            echo "===== 生成偏移表 ====="
            python3 tools/gen_offsets.py --btf btf.bin --out src/cr_offsets.h
            cat src/cr_offsets.h
      - name: 编译模块
        run: |
          VARS='ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CONFIG_MODULE_SIG_ALL=n'
          if [ '${{ matrix.backend }}' = 'rvh' ]; then
            echo '后端: RVH'
          else
            VARS="$VARS KCFLAGS=-DCR_FORCE_PROC=1"
            echo '后端: PROC'
          fi
          if [ '${{ inputs.keep_debug }}' != 'true' ]; then
            VARS="$VARS KCFLAGS=-g0"
          fi
          if [ '${{ inputs.no_crc }}' = 'true' ] && [ -f out/Module.symvers ]; then
            mv out/Module.symvers out/Module.symvers.bak
            VARS="$VARS KBUILD_MODPOST_WARN=1 CONFIG_EXTENDED_MODVERSIONS=n"
          fi
          set +e
          make -C out M=$PWD/src $VARS modules -j$(nproc) 2>&1 | tail -30
          RC=${PIPESTATUS[0]}
          if [ -f src/cpuinfo_redirect.mod.c ] && grep -q '__version_ext_names") =$' src/cpuinfo_redirect.mod.c; then
            echo '修补 .mod.c 空初始化'
            VLINE=$(grep -n '__version_ext_names") =$' src/cpuinfo_redirect.mod.c | head -1 | cut -d: -f1)
            head -n "$VLINE" src/cpuinfo_redirect.mod.c > /tmp/m.c
            printf '\t"";\n' >> /tmp/m.c
            tail -n +$((VLINE + 2)) src/cpuinfo_redirect.mod.c >> /tmp/m.c
            mv /tmp/m.c src/cpuinfo_redirect.mod.c
            touch src/cpuinfo_redirect.mod.c
            make -C out M=$PWD/src $VARS modules -j$(nproc) 2>&1 | tail -10
            RC=$?
          fi
          [ -f out/Module.symvers.bak ] && mv out/Module.symvers.bak out/Module.symvers
          ls -la src/*.ko
          exit $RC

      - name: 校验产物
        run: |
          KO=src/cpuinfo_redirect.ko
          [ -f "$KO" ] || { echo '::error::没有产物'; exit 1; }
          echo '== vermagic =='
          strings "$KO" | grep -m1 '^vermagic='
          echo '== CRC 表 =='
          if strings "$KO" | grep -q '__versions'; then echo '有'; else echo '无（--no-crc 生效）'; fi
          echo "大小: $(stat -c%s $KO) 字节"
          echo "sha256: $(sha256sum $KO | cut -d' ' -f1)"

      - name: 上传诊断材料（失败也传，供离线分析）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.kernel }}
          path: |
            vmlinux-full.log
            out/.config
            pahole.txt
            layout-prereq.txt
            layout-sizes.txt
            spinlock-size.txt
            dwarf-pde.txt
            dwarf-pops.txt
            btf-detached.log
            btf-convert.log
            btf-section.txt
            btf-verify.txt
            src/cr_offsets.h
            src/cpuinfo_redirect.ko
          if-no-files-found: warn

      - name: 上传 vmlinux（供复用，不再重编 25 分钟）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-${{ matrix.kernel }}
          path: out/vmlinux
          if-no-files-found: warn
          compression-level: 0
