name: build-all-kernels

# 为 5.10 / 5.15 / 6.1 / 6.6 / 6.12 / 6.18 六个 GKI 内核各产出一份 cpuinfo_redirect.ko
#
# 为什么必须云端编译：
#   1. 主机工具（sorttable/objtool）依赖 glibc，Android 和 Windows 上都编不过
#   2. PROC 后端需要 vmlinux 才能提取 proc_dir_entry 偏移
#
# 产物 vermagic 是裸版本号（LOCALVERSION 为空），部署时用
#   tools/repack-modinfo.py --uname-r '<目标设备 uname -r>'
# 改成目标设备的完整串，不需要二次编译。
on:
  workflow_dispatch:
    inputs:
      no_crc:
        description: '空 __versions 构建（绕开 Module.symvers）'
        type: boolean
        default: true
      keep_debug:
        description: '保留调试符号（体积大，仅排查用）'
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # 单目标验证阶段：先只在 6.1 上把 BTF 问题解决
          # 成功后再扩回六版本矩阵（见 PROBE-MODE 注释）
          - { branch: 'android12-5.10', kernel: '5.10', backend: 'proc' }
          - { branch: 'android13-5.15', kernel: '5.15', backend: 'proc' }
          - { branch: 'android14-6.1',  kernel: '6.1',  backend: 'proc' }
          - { branch: 'android15-6.6',  kernel: '6.6',  backend: 'rvh'  }
          - { branch: 'android16-6.12', kernel: '6.12', backend: 'proc' }
          # 6.18 的 proc_dir_entry 已删除 proc_dops 字段，布局与 5.10-6.12 不同，
          # 需要单独的偏移表，暂不纳入本轮（见 GPT 复核 E7）
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc flex bison libssl-dev \
            libelf-dev gcc-aarch64-linux-gnu python3 dwarves

      - name: 缓存内核源码
        uses: actions/cache@v4
        with:
          path: kernel
          key: gki-${{ matrix.branch }}-v2

      - name: 获取 GKI 源码
        run: |
          if [ ! -f kernel/Makefile ]; then
            rm -rf kernel
            git clone --depth 1 -b ${{ matrix.branch }} \
              https://android.googlesource.com/kernel/common kernel
          fi
          echo '== 源码版本 =='
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) +=' kernel/Makefile | head -3
          echo '== 是否有 cpuinfo hook =='
          ls kernel/include/trace/hooks/cpuinfo.h 2>/dev/null && echo '有' || echo '无'

      - name: 配置内核
        run: |
            # 用普通 arm64 defconfig：gki_defconfig 是为 build/build.sh 设计的，
            # 直接 make 会缺 KMI 符号表等前置，1 分钟就挂。
            # 只需要 DEBUG_INFO=y —— 后面用 pahole -J 从 DWARF 直接生成 .BTF 段，
            # 完全不碰 DEBUG_INFO_BTF 那条 Kconfig 依赖链（它依赖 PAHOLE_VERSION 探测）。
            make -C kernel O=$PWD/out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
            ./kernel/scripts/config --file out/.config -d DEBUG_INFO_NONE
            ./kernel/scripts/config --file out/.config -e DEBUG_INFO -e DEBUG_INFO_DWARF4
            ./kernel/scripts/config --file out/.config --set-str LOCALVERSION ''
            make -C kernel O=$PWD/out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
            echo "== DEBUG_INFO 配置 =="
            grep -E "CONFIG_DEBUG_INFO" out/.config | head -8
            grep -q "CONFIG_DEBUG_INFO=y" out/.config || { echo "::error::DEBUG_INFO 未开"; exit 1; }
            echo "== pahole =="
            command -v pahole || { echo "::error::缺 pahole"; exit 1; }
            pahole --version
      - name: 编译内核取 vmlinux
        run: |
          set -o pipefail
          make -C kernel O=$PWD/out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc) vmlinux 2>&1 | tee vmlinux-full.log
          RC=$?
          echo "make 退出码: $RC"
          if [ $RC -ne 0 ]; then
            echo "===== 自动提取的错误上下文 ====="
            grep -n -B3 -A8 -E "error:|Error [0-9]|No such file|not found|undefined" build.log | head -150
            echo "===== 日志尾部 60 行 ====="
            tail -60 vmlinux-full.log
            exit $RC
          fi
          tail -20 vmlinux-full.log
          ls -la out/vmlinux

      - name: modules_prepare（生成 module.lds 等模块构建文件）
        run: |
          # make vmlinux 只编内核，不生成 scripts/module.lds。
          # 编模块需要它，缺了会报：No rule to make target scripts/module.lds
          # 注意 modules_prepare 不会生成 Module.symvers（那个要完整构建），
          # 但这轮用 --no-crc 路径，本来就不需要 CRC 表。
          make -C kernel O=$PWD/out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare 2>&1 | tail -10
          echo ""
          echo "=== 关键构建文件 ==="
          for f in scripts/module.lds include/generated/autoconf.h include/config/auto.conf include/generated/asm-offsets.h; do
          if [ -f "out/$f" ]; then echo "  OK   $f"; else echo "  MISS $f"; fi
          done
          [ -f out/scripts/module.lds ] || { echo "::error::module.lds 仍未生成"; exit 1; }
          echo ""
          echo "=== Module.symvers（vmlinux 构建应已产出）==="
          ls -la out/Module.symvers 2>/dev/null || echo "  (无，--no-crc 路径不依赖它)"
      - name: 校验偏移表前提（不依赖 BTF）
        run: |
          # 实测证据：目标内核 CONFIG_RANDSTRUCT_NONE=y、DEBUG_SPINLOCK 与 DEBUG_LOCK_ALLOC 均未设置
          # 此时 __randomize_layout 展开为空、spinlock_t 仅含 arch_spinlock_t(4B)，
          # proc_dir_entry / proc_ops 的偏移由源码声明唯一决定，无需 BTF。
          # 任一条件不成立就失败，而不是产出错误偏移。
          echo "===== 偏移表前提检查 ====="
          FAIL=0
          # RANDSTRUCT 有两套配置体系，都要覆盖：
          #   新体系(6.1+)  CONFIG_RANDSTRUCT_NONE=y
          #   旧体系(5.10/5.15) CONFIG_GCC_PLUGIN_RANDSTRUCT 未设置
          # 三种情况都等价于「布局不随机化」：
          #   a) 新体系显式 NONE
          #   b) 旧体系插件存在但未启用
          #   c) 该内核根本没有 RANDSTRUCT 配置项（arm64 不开 GCC_PLUGINS 时就是这样）
          if grep -q "^CONFIG_RANDSTRUCT_NONE=y" out/.config; then
            echo "  [OK] RANDSTRUCT: NONE（新体系显式关闭）"
          elif grep -q "^# CONFIG_GCC_PLUGIN_RANDSTRUCT is not set" out/.config; then
            echo "  [OK] RANDSTRUCT: 旧体系插件存在但未启用"
          elif ! grep -q "RANDSTRUCT" out/.config; then
            echo "  [OK] RANDSTRUCT: 该内核无此配置项（arm64 未启用 GCC_PLUGINS）"
          else
            echo "  [FAIL] RANDSTRUCT 已启用，布局被随机化"
            grep -E "RANDSTRUCT" out/.config
            FAIL=1
          fi
          grep -q "^CONFIG_SMP=y" out/.config && echo "  [OK] SMP=y" || { echo "  [FAIL] SMP 关闭"; FAIL=1; }
          grep -q "^# CONFIG_DEBUG_SPINLOCK is not set" out/.config && echo "  [OK] DEBUG_SPINLOCK=n" || { echo "  [FAIL] DEBUG_SPINLOCK 开启，spinlock_t 变大"; FAIL=1; }
          grep -q "^# CONFIG_DEBUG_LOCK_ALLOC is not set" out/.config && echo "  [OK] DEBUG_LOCK_ALLOC=n" || { echo "  [FAIL] DEBUG_LOCK_ALLOC 开启，spinlock_t 含 dep_map"; FAIL=1; }
          # PREEMPT_RT 会换掉 spinlock 实现（GPT 复核补充）
          if grep -q "^CONFIG_PREEMPT_RT=y" out/.config; then
            echo "  [FAIL] PREEMPT_RT=y，spinlock_t 是 rt_mutex_base"; FAIL=1
          else
            echo "  [OK] PREEMPT_RT=n"
          fi
          # CONFIG_COMPAT 决定 proc_ops 有没有 proc_compat_ioctl（GPT 复核补充）
          #   COMPAT=y → sizeof(proc_ops)=96，proc_read=16（当前偏移表按这个）
          #   COMPAT=n → sizeof(proc_ops)=88，字段前移
          if grep -q "^CONFIG_COMPAT=y" out/.config; then
            echo "  [OK] COMPAT=y，proc_ops=96 字节"
          else
            echo "  [FAIL] COMPAT!=y，proc_ops=88 字节，偏移表需重算"; FAIL=1
          fi
          [ $FAIL -eq 0 ] || { echo "::error::布局前提不满足"; exit 1; }
          echo "前提全部成立，使用固定偏移表"
          echo ""
          echo "===== 当前偏移表 ====="
          cat src/cr_offsets.h
          echo ""
          echo "===== 交叉验证 DWARF 链路是通的（seq_file 在 DWARF 里）====="
          pahole -C seq_file out/vmlinux 2>&1 | head -3 || true
      - name: 编译模块
        run: |
          # KCFLAGS 只能赋值一次：make 取最后一次赋值，重复赋值会丢掉前面参数
          KCF=""
          if [ '${{ matrix.backend }}' != 'rvh' ]; then
            KCF="$KCF -DCR_FORCE_PROC=1"
            echo '后端: PROC'
          else
            echo '后端: RVH'
          fi
          if [ '${{ inputs.keep_debug }}' != 'true' ]; then
            KCF="$KCF -g0"
          fi
          echo "KCFLAGS=$KCF"
          VARS="ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CONFIG_MODULE_SIG_ALL=n"

          # 关键：不能移走 Module.symvers。它不只是 CRC 表，还是符号定义表。
          # 移走后 modpost 找不到任何内核符号，6.6+ 会直接报 ERROR 而不是 WARNING。
          # 正确做法：保留 symvers 让符号正常解析，编译完再删掉 .ko 里的 __versions 段。
          echo "Module.symvers: $(wc -l < out/Module.symvers 2>/dev/null || echo 0) 行"
          set +e
          make -C out "M=$PWD/src" $VARS "KCFLAGS=$KCF" modules -j$(nproc) 2>&1 | tail -30
          RC=${PIPESTATUS[0]}
          if [ -f src/cpuinfo_redirect.mod.c ] && grep -q '__version_ext_names") =$' src/cpuinfo_redirect.mod.c; then
            echo '修补 .mod.c 空初始化'
            VLINE=$(grep -n '__version_ext_names") =$' src/cpuinfo_redirect.mod.c | head -1 | cut -d: -f1)
            head -n "$VLINE" src/cpuinfo_redirect.mod.c > /tmp/m.c
            printf '\t"";\n' >> /tmp/m.c
            tail -n +$((VLINE + 2)) src/cpuinfo_redirect.mod.c >> /tmp/m.c
            mv /tmp/m.c src/cpuinfo_redirect.mod.c
            touch src/cpuinfo_redirect.mod.c
            make -C out "M=$PWD/src" $VARS "KCFLAGS=$KCF" modules -j$(nproc) 2>&1 | tail -10
            RC=$?
          fi
          [ -f out/Module.symvers.bak ] && mv out/Module.symvers.bak out/Module.symvers
          ls -la src/*.ko
          # Remove __versions so kernel check_version finds no CRC and passes.
          # Symbols already resolved via Module.symvers, so modpost succeeds.
          if [ -f src/cpuinfo_redirect.ko ]; then
            if aarch64-linux-gnu-objcopy --remove-section=__versions \
                 src/cpuinfo_redirect.ko src/cpuinfo_redirect-nocrc.ko 2>/dev/null \
               && [ -s src/cpuinfo_redirect-nocrc.ko ]; then
              mv src/cpuinfo_redirect-nocrc.ko src/cpuinfo_redirect.ko
              echo "removed __versions, now $(stat -c%s src/cpuinfo_redirect.ko) bytes"
            else
              echo "no __versions to remove (ok)"
            fi
            if strings src/cpuinfo_redirect.ko | grep -q __versions; then
              echo "::warning::__versions still present"
            else
              echo "confirmed: no __versions section"
            fi
          exit $RC
          fi

      - name: 校验产物
        run: |
          KO=src/cpuinfo_redirect.ko
          [ -f "$KO" ] || { echo '::error::没有产物'; exit 1; }
          echo '== vermagic =='
          strings "$KO" | grep -m1 '^vermagic='
          echo '== CRC 表 =='
          if strings "$KO" | grep -q '__versions'; then echo '有'; else echo '无（--no-crc 生效）'; fi
          echo "大小: $(stat -c%s $KO) 字节"
          echo "sha256: $(sha256sum $KO | cut -d' ' -f1)"

      - name: 上传诊断材料（失败也传，供离线分析）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.kernel }}
          path: |
            vmlinux-full.log
            out/.config
            pahole.txt
            layout-prereq.txt
            layout-sizes.txt
            spinlock-size.txt
            dwarf-pde.txt
            dwarf-pops.txt
            btf-detached.log
            btf-convert.log
            btf-section.txt
            btf-verify.txt
            src/cr_offsets.h
            src/cpuinfo_redirect.ko
          if-no-files-found: warn

      - name: 上传 vmlinux（供复用，不再重编 25 分钟）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-${{ matrix.kernel }}
          path: out/vmlinux
          if-no-files-found: warn
          compression-level: 0
